name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest and Generate Report
      id: run_tests
      continue-on-error: true
      run: |
        pip install pytest-json-report
        pytest --json-report --json-report-file=report.json

    - name: Send Report to Receiver
      if: always()
      env:
        RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
      run: |
        if [ -n "$RECEIVER_URL" ]; then
          python -c "
          import json, os, requests
          report_path = 'report.json'
          if os.path.exists(report_path):
              with open(report_path) as f:
                  data = json.load(f)
              payload = {
                  'repository': os.getenv('GITHUB_REPOSITORY'),
                  'branch': os.getenv('GITHUB_REF_NAME'),
                  'commit_sha': os.getenv('GITHUB_SHA'),
                  'run_id': os.getenv('GITHUB_RUN_ID'),
                  'timestamp': data.get('created'),
                  'summary': {
                      'total': data.get('summary', {}).get('total', 0),
                      'passed': data.get('summary', {}).get('passed', 0),
                      'failed': data.get('summary', {}).get('failed', 0),
                      'status': 'SUCCESS' if data.get('exitcode') == 0 else 'FAILURE'
                  },
                  'tests': [{'name': t.get('nodeid'), 'result': t.get('outcome'), 'message': t.get('longrepr', '')} for t in data.get('tests', [])]
              }
              try:
                  res = requests.post(os.getenv('RECEIVER_URL'), json=payload, timeout=10)
                  print('Report sent successfully:', res.status_code)
              except Exception as e:
                  print('Failed to send report:', e)
          else:
              print('report.json not found!')
          "
        else:
          echo "RECEIVER_URL secret not set. Skipping report transmission."
        fi
