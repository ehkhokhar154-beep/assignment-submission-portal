<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment Submission Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; }
        .form-group { margin-bottom: 12px; }
        label { display: inline-block; width: 160px; font-weight: bold; }
        input[type="text"], input[type="url"] { width: 300px; padding: 6px; }
        button { padding: 8px 16px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .error { color: red; font-weight: bold; margin-bottom: 15px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <h2>Assignment Submission Portal</h2>

    {% if error %}
        <div class="error" id="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/">
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Registration Number:</label>
            <input type="text" name="reg_num">
        </div>
        <div class="form-group">
            <label>Assignment Title:</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>Submission URL:</label>
            <input type="url" name="url" required>
        </div>
        <button type="submit">Submit Assignment</button>
    </form>

    <hr>

    <h3>Submitted Assignments</h3>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Reg No.</th>
                <th>Title</th>
                <th>URL</th>
            </tr>
        </thead>
        <tbody>
            {% for sub in submissions %}
            <tr>
                <td>{{ sub.name }}</td>
                <td>{{ sub.reg_num }}</td>
                <td>{{ sub.title }}</td>
                <td><a href="{{ sub.url }}" target="_blank">{{ sub.url }}</a></td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No submissions yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
